  <script>
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      // The first glyph is a rounded triangle wave: apexes every 14.55 units,
      // alternating between y = -3.41 and y = 33.76, stroke 3.55 wide.
      const half = 14.55, period = 2 * half, top = -3.41, bottom = 33.76;
      const radius = 2.9, strokeWidth = 3.55, firstApex = 0.12;
      const glyphLeft = 0, glyphRight = 39.92, restLeft = 42.79;
      const duration = 4000, holdFull = 600, shrinkEnd = 3600, fade = 250, restFade = 500;
      const travel = 4 * period;

      const ns = 'http://www.w3.org/2000/svg';
      const glyph = document.getElementById('wave');
      const svg = glyph.ownerSVGElement;
      const rest = [...svg.querySelectorAll('path')].filter((p) => p !== glyph);
      const ctm = svg.getScreenCTM();
      const pageLeft = -ctm.e / ctm.a, pageRight = (innerWidth - ctm.e) / ctm.a;

      const apexes = [];
      const first = Math.floor((pageLeft - firstApex) / half) - 2;
      const last = Math.ceil((pageRight + travel - firstApex) / half) + 2;
      for (let i = first; i <= last; i++) {
        apexes.push([firstApex + i * half, i % 2 === 0 ? top : bottom]);
      }
      let d = `M${apexes[0]}`;
      for (let i = 1; i < apexes.length - 1; i++) {
        const [px, py] = apexes[i - 1], [ax, ay] = apexes[i], [nx, ny] = apexes[i + 1];
        const ux = px - ax, uy = py - ay, vx = nx - ax, vy = ny - ay;
        const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
        const angle = Math.acos((ux * vx + uy * vy) / (lu * lv));
        const cut = radius / Math.tan(angle / 2);
        const sweep = (ax - px) * (ny - ay) - (ay - py) * (nx - ax) > 0 ? 1 : 0;
        d += `L${ax + ux / lu * cut},${ay + uy / lu * cut}`;
        d += `A${radius},${radius},0,0,${sweep},${ax + vx / lv * cut},${ay + vy / lv * cut}`;
      }
      d += `L${apexes[apexes.length - 1]}`;

      const set = (el, attrs) => Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      const clip = document.createElementNS(ns, 'clipPath');
      clip.id = 'wave-window';
      const rect = document.createElementNS(ns, 'rect');
      set(rect, { y: -5, height: 41 });
      clip.append(rect);
      const group = document.createElementNS(ns, 'g');
      group.setAttribute('clip-path', 'url(#wave-window)');
      const line = document.createElementNS(ns, 'path');
      set(line, { d, fill: 'none', stroke: '#e3232f', 'stroke-width': strokeWidth });
      group.append(line);
      svg.prepend(clip);
      svg.append(group);
      svg.style.overflow = 'visible';
      glyph.style.opacity = 0;
      rest.forEach((p) => (p.style.opacity = 0));

      const clamp = (x) => Math.min(Math.max(x, 0), 1);
      const easeInOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
      const lerp = (a, b, k) => a + (b - a) * k;
      let start, restStart;
      const frame = (now) => {
        start ??= now;
        const ms = Math.min(now - start, duration);
        const u = ms / duration;
        line.setAttribute('transform', `translate(${-travel * (1 - u) ** 2},0)`);

        const k = easeInOut(clamp((ms - holdFull) / (shrinkEnd - holdFull)));
        const left = lerp(pageLeft, glyphLeft, k), right = lerp(pageRight, glyphRight, k);
        set(rect, { x: left, width: right - left });

        if (restStart === undefined && right <= restLeft) restStart = ms;
        if (restStart !== undefined) {
          const shown = clamp((ms - restStart) / restFade);
          rest.forEach((p) => (p.style.opacity = shown));
        }

        const handoff = clamp((duration - ms) / fade);
        group.style.opacity = handoff;
        glyph.style.opacity = 1 - handoff;

        if (ms < duration) requestAnimationFrame(frame);
        else {
          group.remove();
          clip.remove();
          svg.style.overflow = '';
          [glyph, ...rest].forEach((p) => (p.style.opacity = ''));
        }
      };
      requestAnimationFrame(frame);
    })();
